<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Blog | Add Blog</title>
  </head>
  <body>
    <header>
      <nav>
        <h1>Simple Blog</h1>

        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="add-blog.html">Add Blog</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Create a New Blog</h2>

        <form>
          <div>
            <label for="title">Blog Title</label><br />
            <input
              type="text"
              id="title"
              name="title"
              placeholder="Enter blog title"
              required
            />
          </div>

          <br />

          <div>
            <label for="author">Author Name</label><br />
            <input
              type="text"
              id="author"
              name="author"
              placeholder="Enter your name"
              required
            />
          </div>

          <br />

          <div>
            <label for="content">Blog Content</label><br />
            <textarea
              id="content"
              name="content"
              rows="8"
              cols="40"
              placeholder="Write your blog here..."
              required
            ></textarea>
          </div>

          <br />

          <button type="submit">Publish Blog</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Simple Blog Management System. All rights reserved.</p>
    </footer>
  </body>
</html>
